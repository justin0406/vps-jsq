name = "vps-jsq"
compatibility_date = "2024-11-01"
main = "src/worker.js"

[assets]
directory = "dist"
binding = "ASSETS"

# 分享图存储（可选功能）：在 Cloudflare 后台 Storage & databases → KV 创建命名空间
