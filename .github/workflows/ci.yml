name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装锁定依赖
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: 单元测试
        run: npm test

      - name: 生产构建
        run: npm run build

      - name: Wrangler dry-run（不实际部署）
        run: npx wrangler deploy --dry-run --outdir ./dist-dry
